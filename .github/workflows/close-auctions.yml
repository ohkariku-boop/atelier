name: Close Expired Auctions

# Every 5 minutes: call close_all_expired_auctions RPC via PostgREST.
# Does not require the Edge Function to be deployed.
#
# Required repository secrets:
#   SUPABASE_URL              – e.g. https://ogjxysfnidfclgjedjzs.supabase.co
#   SUPABASE_SERVICE_ROLE_KEY – service_role JWT

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  close:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Close expired auctions via RPC
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SERVICE_KEY" ]; then
            echo "Missing SUPABASE_URL or SUPABASE_SERVICE_ROLE_KEY – skipping."
            exit 0
          fi

          response=$(curl -s -w "\n%{http_code}" -X POST \
            "$SUPABASE_URL/rest/v1/rpc/close_all_expired_auctions" \
            -H "apikey: $SERVICE_KEY" \
            -H "Authorization: Bearer $SERVICE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}')

          body=$(echo "$response" | sed '$d')
          status=$(echo "$response" | tail -n1)

          echo "HTTP $status"
          echo "$body" | jq . 2>/dev/null || echo "$body"

          if [ "$status" -ge 400 ]; then
            echo "RPC returned error status"
            exit 1
          fi
