name: Deploy Supabase Edge Functions

# Deploys Edge Functions from this repo so you do not need the Supabase CLI locally.
#
# Required repository secrets:
#   SUPABASE_ACCESS_TOKEN  – https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   – ogjxysfnidfclgjedjzs (or set as variable)
#
# Stripe / Resend / OpenAI secrets are configured in Supabase Dashboard → Edge Function Secrets

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'project/supabase/functions/**'
      - '.github/workflows/deploy-edge-functions.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ./project

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -e
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing secret SUPABASE_ACCESS_TOKEN"
            exit 1
          fi

          REF="${PROJECT_REF:-ogjxysfnidfclgjedjzs}"
          echo "Deploying functions to project ref: $REF"

          deploy() {
            local name="$1"
            local extra="${2:-}"
            echo "=== Deploy $name ==="
            # shellcheck disable=SC2086
            supabase functions deploy "$name" --project-ref "$REF" $extra
          }

          deploy close-expired-auctions "--no-verify-jwt" || true
          deploy send-receipt-email
          deploy notify-seller-sale || true

          deploy stripe-create-checkout
          deploy stripe-webhook "--no-verify-jwt"
          deploy stripe-connect-onboard
          deploy stripe-connect-status || true
          deploy stripe-identity-create || true
          deploy stripe-identity-status || true

          deploy verify-artwork-images

          echo "Deploy finished."
