name: Deploy Supabase Edge Functions

# Deploys Edge Functions from this repo so you do not need the Supabase CLI locally.
#
# Required repository secrets:
#   SUPABASE_ACCESS_TOKEN  – https://supabase.com/dashboard/account/tokens
#   SUPABASE_PROJECT_REF   – ogjxysfnidfclgjedjzs (or set as variable)
#
# Optional (if not using a secret for ref):
#   defaults to ogjxysfnidfclgjedjzs below
#
# Stripe / Resend secrets are configured in Supabase Dashboard → Edge Function Secrets
# (STRIPE_SECRET_KEY, STRIPE_WEBHOOK_SECRET, SITE_URL, RESEND_API_KEY, etc.)
# This workflow only uploads function *code*.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'project/supabase/functions/**'
      - '.github/workflows/deploy-edge-functions.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ./project

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Supabase CLI
        run: npm install -g supabase

      - name: Deploy Edge Functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          set -e
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "Missing secret SUPABASE_ACCESS_TOKEN"
            echo "Create one at https://supabase.com/dashboard/account/tokens"
            exit 1
          fi

          REF="${PROJECT_REF:-ogjxysfnidfclgjedjzs}"
          echo "Deploying functions to project ref: $REF"

          # Core marketplace functions
          supabase functions deploy close-expired-auctions --project-ref "$REF" --no-verify-jwt || true
          supabase functions deploy send-receipt-email --project-ref "$REF"
          supabase functions deploy notify-seller-sale --project-ref "$REF" || true

          # Stripe
          supabase functions deploy stripe-create-checkout --project-ref "$REF"
          supabase functions deploy stripe-webhook --project-ref "$REF" --no-verify-jwt
          supabase functions deploy stripe-connect-onboard --project-ref "$REF"

          echo "Deploy finished."
