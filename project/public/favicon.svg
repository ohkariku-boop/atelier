<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" fill="#1a1917"/>
  <!-- Auction gavel: head + handle (aligned with foyer / header mark) -->
  <g transform="translate(16 16) rotate(-32)" fill="#fafaf9">
    <!-- Head -->
    <rect x="-9" y="-7.5" width="14" height="7" rx="1.2"/>
    <!-- Handle -->
    <rect x="-1.15" y="-1" width="2.3" height="13" rx="1"/>
  </g>
  <!-- Subtle metal band on head -->
  <g transform="translate(16 16) rotate(-32)" fill="none" stroke="#1a1917" stroke-width="1">
    <line x1="-5" y1="-4" x2="1" y2="-4" opacity="0.35"/>
  </g>
</svg>
